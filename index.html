<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记账本</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f3f4f7;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#222;display:flex;justify-content:center}
.app{width:100%;max-width:390px;min-height:780px;padding:16px 16px 28px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.hd{font-size:13px;color:#777;display:flex;justify-content:space-between}
.total{font-size:36px;font-weight:700;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.total.over{color:#e53935}
.bar{height:12px;background:#e8eaf0;border-radius:6px;overflow:hidden}
.fill{height:100%;background:#2e9e6b;border-radius:6px}
.fill.over{background:#e53935}
.meta{display:flex;justify-content:space-between;font-size:12px;color:#777;margin-top:6px}
.warn{margin-top:10px;background:#fdecea;color:#c62828;font-size:14px;font-weight:600;padding:8px 10px;border-radius:8px}
.ok{margin-top:10px;background:#e7f5ee;color:#1f7a50;font-size:14px;padding:8px 10px;border-radius:8px}
h2{font-size:15px;margin-bottom:12px}
.chart{display:flex;align-items:center;gap:16px}
.legend{flex:1;font-size:13px}
.legend div{display:flex;align-items:center;padding:4px 0}
.dot{width:10px;height:10px;border-radius:3px;margin-right:8px}
.legend .n{flex:1}.legend .p{color:#777;font-variant-numeric:tabular-nums}
.item{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #f0f1f4}
.item:last-child{border:0}
.ic{width:36px;height:36px;border-radius:10px;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;margin-right:10px;flex:none}
.info{flex:1;min-width:0}.info b{font-size:14px;font-weight:600}.info span{display:block;font-size:12px;color:#888;margin-top:2px}
.amt{font-weight:600;font-variant-numeric:tabular-nums;margin-right:8px}
.del{border:0;background:none;color:#bbb;font-size:18px;padding:2px 6px}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form input,form select{width:100%;padding:10px;border:1px solid #dde0e6;border-radius:8px;font-size:14px;background:#fff}
form input.w{grid-column:1/3}
form button{grid-column:1/3;padding:11px;border:0;border-radius:8px;background:#3d5afe;color:#fff;font-size:15px}
.where{margin:14px 0 6px;text-align:center;font-size:12px;color:#8a8f98}.where b{color:#3d5afe}
</style>
</head>
<body>
<div class="app">
  <div class="card" id="sum"></div>
  <div class="card"><h2>类别占比</h2><div class="chart" id="chart"></div></div>
  <div class="card"><h2>本月明细 <span id="cnt" style="color:#999;font-weight:400;font-size:12px"></span></h2><div id="list"></div></div>
  <div class="card"><h2>记一笔</h2>
    <form id="f">
      <input class="w" id="a" type="number" min="0.01" step="0.01" placeholder="金额（元）" required>
      <select id="c"><option>餐饮</option><option>交通</option><option>购物</option><option>其他</option></select>
      <input id="d" type="date" required>
      <button type="submit">添加</button>
    </form>
  </div>
  <div class="where">数据保存在：<b>这台设备的浏览器里</b></div>
</div>
<script>
var BUDGET=3000,CATS=["餐饮","交通","购物","其他"],COL={"餐饮":"#f59e0b","交通":"#3b82f6","购物":"#ec4899","其他":"#8b5cf6"};
var now=new Date(),Y=now.getFullYear(),M=now.getMonth(),TD=now.getDate();
function pad(n){return n<10?"0"+n:""+n}
function ds(day){return Y+"-"+pad(M+1)+"-"+pad(Math.min(day,TD))}
var seed=[[1,"餐饮","朋友聚餐",268],[2,"餐饮","午餐",56],[3,"交通","地铁充值",200],[4,"购物","秋季外套",899],[5,"餐饮","外卖",92],[6,"其他","话费网费",180],[7,"交通","打车",85],[8,"购物","蓝牙耳机",699],[9,"餐饮","火锅",386],[10,"交通","加油",420],[11,"其他","体检",450],[11,"购物","日用品",245]];
var recs=seed.map(function(s,i){return{id:i,date:ds(s[0]),cat:s[1],note:s[2],amt:s[3]}});
var KEY="jizhang-v1";try{var sv=JSON.parse(localStorage.getItem(KEY)||"null");if(sv&&sv.recs){recs=sv.recs;}}catch(e){}
var nid=recs.reduce(function(m,r){return Math.max(m,r.id)},99)+1;
function save(){try{localStorage.setItem(KEY,JSON.stringify({recs:recs}))}catch(e){}}
function f(n){return n.toLocaleString("zh-CN",{minimumFractionDigits:0,maximumFractionDigits:2})}
function render(){
  var mk=Y+"-"+pad(M+1);
  var cur=recs.filter(function(r){return r.date.indexOf(mk)===0}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});
  var total=cur.reduce(function(s,r){return s+r.amt},0),over=total>BUDGET;
  var pct=Math.min(100,total/BUDGET*100);
  document.getElementById("sum").innerHTML=
    '<div class="hd"><span>'+Y+'年'+(M+1)+'月 总支出</span><span>预算 ¥'+f(BUDGET)+'</span></div>'+
    '<div class="total'+(over?' over':'')+'">¥'+f(total)+'</div>'+
    '<div class="bar"><div class="fill'+(over?' over':'')+'" style="width:'+pct+'%"></div></div>'+
    '<div class="meta"><span>已用 '+Math.round(total/BUDGET*100)+'%</span><span>'+(over?'预算已用完':'剩余 ¥'+f(BUDGET-total))+'</span></div>'+
    (over?'<div class="warn">已超出预算 ¥'+f(total-BUDGET)+'</div>':'<div class="ok">预算内，继续保持</div>');
  var by={};CATS.forEach(function(c){by[c]=0});cur.forEach(function(r){by[r.cat]+=r.amt});
  var R=46,C=2*Math.PI*R,off=0,svg='<svg width="130" height="130" viewBox="0 0 130 130"><circle cx="65" cy="65" r="'+R+'" fill="none" stroke="#e8eaf0" stroke-width="22"/>';
  if(total>0)CATS.forEach(function(c){var l=by[c]/total*C;if(l>0){svg+='<circle cx="65" cy="65" r="'+R+'" fill="none" stroke="'+COL[c]+'" stroke-width="22" stroke-dasharray="'+l+' '+(C-l)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 65 65)"/>';off+=l}});
  svg+='<text x="65" y="62" text-anchor="middle" font-size="11" fill="#888">总支出</text><text x="65" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#222">¥'+f(total)+'</text></svg>';
  var lg='<div class="legend">'+CATS.map(function(c){return '<div><span class="dot" style="background:'+COL[c]+'"></span><span class="n">'+c+' ¥'+f(by[c])+'</span><span class="p">'+(total?Math.round(by[c]/total*100):0)+'%</span></div>'}).join("")+'</div>';
  document.getElementById("chart").innerHTML=svg+lg;
  document.getElementById("cnt").textContent="共 "+cur.length+" 笔";
  document.getElementById("list").innerHTML=cur.map(function(r){return '<div class="item"><div class="ic" style="background:'+COL[r.cat]+'">'+r.cat+'</div><div class="info"><b>'+(r.note||r.cat)+'</b><span>'+r.date.slice(5).replace("-","月")+'日</span></div><div class="amt">-¥'+f(r.amt)+'</div><button class="del" data-id="'+r.id+'" aria-label="删除">×</button></div>'}).join("")||'<div style="color:#999;font-size:13px">暂无记录</div>';
}
document.getElementById("list").onclick=function(e){var id=e.target.getAttribute("data-id");if(id!==null){recs=recs.filter(function(r){return r.id!=id});save();render()}};
document.getElementById("d").value=Y+"-"+pad(M+1)+"-"+pad(TD);
document.getElementById("f").onsubmit=function(e){e.preventDefault();var a=parseFloat(document.getElementById("a").value);if(!(a>0))return;
  recs.push({id:nid++,date:document.getElementById("d").value,cat:document.getElementById("c").value,note:"",amt:a});document.getElementById("a").value="";save();render()};
render();
</script>
</body>
</html>
